name: Apply A-B Repeat Persistence Fix

on:
  push:
    branches:
      - feature/persist-ab-repeat

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: feature/persist-ab-repeat

      - name: Apply patch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('application/vlc-android/src/org/videolan/vlc/media/PlaylistManager.kt')
          s = p.read_text()

          old = '''            val abStart = if (settings.getBoolean(PLAYBACK_HISTORY, true))  media.getMetaLong(MediaWrapper.META_AB_REPEAT_START) else 0L
            if (abStart != 0L) {
                abRepeatOn.value = true
                val abStop = media.getMetaLong(MediaWrapper.META_AB_REPEAT_STOP)
                abRepeat.postValue(ABRepeat(abStart, if (abStop == 0L) -1L else abStop))
            }'''
          new = '''            // A-B repeat is stored per media. Always reset the in-memory state first
            // so markers from the previous video can never leak into this one.
            abRepeat.value = ABRepeat()
            abRepeatOn.value = false
            val abStart = if (settings.getBoolean(PLAYBACK_HISTORY, true)) media.getMetaLong(MediaWrapper.META_AB_REPEAT_START) else 0L
            if (abStart != 0L) {
                abRepeatOn.value = true
                val abStop = media.getMetaLong(MediaWrapper.META_AB_REPEAT_STOP)
                abRepeat.postValue(ABRepeat(abStart, if (abStop == 0L) -1L else abStop))
            }'''
          if old not in s:
              raise SystemExit('loadMediaMeta target not found')
          s = s.replace(old, new, 1)

          old = '''                MediaPlayer.Event.EndReached -> {
                    clearABRepeat()
                    getCurrentMedia()?.addFlags(MediaWrapper.MEDIA_FROM_START)'''
          new = '''                MediaPlayer.Event.EndReached -> {
                    // Keep the saved A-B markers. They are persisted on the media and
                    // restored by loadMediaMeta() when this video is played again.
                    // loadMediaMeta() also clears stale in-memory markers before restoring
                    // the current video's values.
                    getCurrentMedia()?.addFlags(MediaWrapper.MEDIA_FROM_START)'''
          if old not in s:
              raise SystemExit('EndReached target not found')
          s = s.replace(old, new, 1)

          p.write_text(s)
          PY

      - name: Verify Kotlin source
        run: |
          grep -n -A12 -B3 'Keep the saved A-B markers' application/vlc-android/src/org/videolan/vlc/media/PlaylistManager.kt
          grep -n -A12 -B3 'A-B repeat is stored per media' application/vlc-android/src/org/videolan/vlc/media/PlaylistManager.kt

      - name: Commit and push
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add application/vlc-android/src/org/videolan/vlc/media/PlaylistManager.kt
          git commit -m 'fix: persist A-B repeat per video' || exit 0
          git push origin HEAD:feature/persist-ab-repeat

      - name: Remove temporary workflow
        if: always()
        run: |
          git fetch origin feature/persist-ab-repeat
          git checkout feature/persist-ab-repeat
          if [ -f .github/workflows/apply-ab-repeat-fix.yml ]; then
            git rm .github/workflows/apply-ab-repeat-fix.yml
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'chore: remove temporary patch workflow'
            git push origin HEAD:feature/persist-ab-repeat
          fi
